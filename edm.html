<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국생명공학연구원 생물자원 기술설명회</title>
</head>

<body style="margin:0; padding:0; background:#ffffff;">

  <table
    role="presentation"
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="
      margin:0;
      padding:0;
      border-collapse:collapse;
      background:#ffffff;
    "
  >
    <tr>
      <td align="left" style="margin:0; padding:0;">

        <table
          role="presentation"
          width="800"
          cellspacing="0"
          cellpadding="0"
          border="0"
          style="
            width:800px;
            border-collapse:collapse;
          "
        >
          <tr>
            <td style="margin:0; padding:0;">

              <img
                src="https://raw.githubusercontent.com/Darae-Daejeon/KRIBB/main/eDM_KRIBB.png"
                width="800"
                alt="한국생명공학연구원 생물자원 기술설명회"
                usemap="#kribb-event-map"
                border="0"
                style="
                  display:block;
                  width:800px;
                  height:auto;
                  margin:0;
                  padding:0;
                  border:0;
                  outline:none;
                  text-decoration:none;
                "
              >

              <map name="kribb-event-map" id="kribb-event-map">

                <!-- 버튼 1 -->
                <area
                  shape="rect"
                  coords="82,586,169,614"
                  href="https://darae-daejeon.github.io/KRIBB/"
                  target="_blank"
                  alt="기술 1 자세히 보기"
                >

                <!-- 버튼 2 -->
                <area
                  shape="rect"
                  coords="433,586,513,616"
                  href="https://darae-daejeon.github.io/KRIBB/"
                  target="_blank"
                  alt="기술 2 자세히 보기"
                >

                <!-- 버튼 3 -->
                <area
                  shape="rect"
                  coords="84,859,169,887"
                  href="https://darae-daejeon.github.io/KRIBB/"
                  target="_blank"
                  alt="기술 3 자세히 보기"
                >

                <!-- 버튼 4 -->
                <area
                  shape="rect"
                  coords="431,858,514,888"
                  href="https://darae-daejeon.github.io/KRIBB/"
                  target="_blank"
                  alt="기술 4 자세히 보기"
                >

                <!-- 사전 신청하기 -->
                <area
                  shape="rect"
                  coords="248,1019,544,1076"
                  href="https://moaform.com/q/mumsdF"
                  target="_blank"
                  alt="사전 신청하기"
                >

              </map>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
